version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghatwatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/ghatwatch
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/ghatwatch
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TEMPLATE_NAME_EN: ${WHATSAPP_TEMPLATE_NAME_EN:-ghat_advisory_en}
      WHATSAPP_TEMPLATE_NAME_HI: ${WHATSAPP_TEMPLATE_NAME_HI:-ghat_advisory_hi}
      WHATSAPP_DRY_RUN: ${WHATSAPP_DRY_RUN:-true}
      DATA_FRESHNESS_THRESHOLD_DAYS: ${DATA_FRESHNESS_THRESHOLD_DAYS:-90}
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

volumes:
  postgres_data:
